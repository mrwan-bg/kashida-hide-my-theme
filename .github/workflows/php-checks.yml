name: PHP checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php-lint:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.6']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint plugin PHP files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  build-plugin-zip:
    name: Build WordPress install ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Assemble plugin package
        run: |
          mkdir -p package/kashida-hide-my-theme
          cp kashida-hide-my-theme.php uninstall.php readme.txt package/kashida-hide-my-theme/
          cp -R assets languages package/kashida-hide-my-theme/
          cd package
          zip -r ../kashida-hide-my-theme-1.5.5.zip kashida-hide-my-theme
      - name: Upload install ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kashida-hide-my-theme-1.5.5
          path: kashida-hide-my-theme-1.5.5.zip
          if-no-files-found: error
          retention-days: 30
